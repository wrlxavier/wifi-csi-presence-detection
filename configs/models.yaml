experiment:
  name: "presence_detection_benchmark"
  random_seed: 42
  cv_folds: 10
  scoring: "f1_macro"
  f1_pass_threshold: 0.90

paths:
  splits_dir: "data/03_processed/splits"
  models_dir: "models"
  registry_dir: "models/registry"
  reports_dir: "reports"

models:
  random_forest:
    n_estimators: [50, 100, 200]
    max_depth: [null, 10, 20]
  svm:
    C: [0.1, 1.0, 10.0]
    kernel: ["rbf", "linear"]
  gradient_boosting:
    n_estimators: [50, 100]
    learning_rate: [0.05, 0.1]
    max_depth: [3, 5]
  mlp:
    hidden_layer_sizes: [[50], [100], [50, 50]]
    max_iter: [500]
